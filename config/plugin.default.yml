# dsh-vision-triage 插件默认配置（与 plugin/cordis.patch.yml 中 config 对应）
# 部署时可在 profile 的 cordis.patch.yml 中按需覆盖。

# 本地推理 Python 解释器（环境变量 DSH_VISIT_PYTHON 优先）
python: E:\conda\envs\sdenv\python.exe

# 模型/数据集目录（环境变量 DSH_VISIT_MODELS_DIR / DSH_VISIT_DATA_DIR 优先）
# modelsDir:
# dataDir:

# 云端 describe_image（多 provider，默认 deepseek）
# provider: deepseek | qwen
#   deepseek（默认）：DeepSeek-V4-Flash-Vision-Exp（DEEPSEEK_API_KEY，api.deepseek.com，
#                     谷时更便宜；定位/坐标类追问精度高）
#   qwen          ：Qwen-VL（QWEN_VISION_API_KEY，阿里云 DashScope，峰时更便宜）
provider: deepseek

# 显式覆盖（优先于 provider 默认值；不设置则用 provider 默认）
# baseUrl: https://api.deepseek.com
# model: deepseek-v4-flash-vision-exp
# apiKeyRef: DEEPSEEK_API_KEY

# 凭据（不在此配置，走 DSH 凭据存储）
# DEEPSEEK_API_KEY: sk-xxx
# QWEN_VISION_API_KEY: sk-xxx
