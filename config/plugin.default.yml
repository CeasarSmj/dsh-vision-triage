# dsh-vision-triage 插件默认配置（与 plugin/cordis.patch.yml 中 config 对应）
# 部署时可在 profile 的 cordis.patch.yml 中按需覆盖。

# 本地推理 Python 解释器（环境变量 DSH_VISIT_PYTHON 优先）
python: E:\conda\envs\sdenv\python.exe

# 模型/数据集目录（环境变量 DSH_VISIT_MODELS_DIR / DSH_VISIT_DATA_DIR 优先）
# modelsDir:
# dataDir:

# 云端 describe_image（多 provider，默认 qwen）
# provider: qwen | deepseek
#   qwen（默认）  ：Qwen-VL（QWEN_VISION_API_KEY，阿里云 DashScope）
#   deepseek      ：DeepSeek-V4-Flash-Vision-Exp（DEEPSEEK_API_KEY，api.deepseek.com）
provider: qwen

# 显式覆盖（优先于 provider 默认值；不设置则用 provider 默认）
# baseUrl: https://dashscope.aliyuncs.com/compatible-mode/v1
# model: qwen-vl-max
# apiKeyRef: QWEN_VISION_API_KEY

# 凭据（不在此配置，走 DSH 凭据存储）
# QWEN_VISION_API_KEY: sk-xxx
# DEEPSEEK_API_KEY: sk-xxx
